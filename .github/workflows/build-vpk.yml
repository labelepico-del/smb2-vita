name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    env:
      SMB2_COMMIT: b73415e1953d7fdffd4957d5fb43fa7a13844c1c
      SMB2_PRG0: 47ba60fad332fdea5ae44b7979fe1ee78de1d316ee027fea2ad5fe3c0d86f25a

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Force fresh build
        run: 'echo "Build trigger: $(date +%s)"'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --parallel "$(nproc)" --verbose 2>&1 | head -200

      - name: Verify build artifacts
        run: |
          echo "=== Checking build directory ==="
          ls -la build/
          echo "=== Looking for executable ==="
          find build/ -type f -executable 2>/dev/null | head -20 || true
          echo "=== Checking for smb2_vita ==="
          ls -la build/smb2_vita 2>/dev/null || echo "NOT FOUND: build/smb2_vita"
          ls -la build/smb2_vita.elf 2>/dev/null || echo "NOT FOUND: build/smb2_vita.elf"
          echo "=== Checking vita tools ==="
          which vita-elf-create vita-make-fself vita-mksfoex vita-pack-vpk

      - name: Build SELF using CMake target
        run: |
          echo "=== Building SELF target ==="
          cmake --build build --target smb2_vita.self --verbose 2>&1 | head -100 || true
          ls -la build/smb2_vita.self 2>/dev/null || echo "NOT FOUND: build/smb2_vita.self"

      - name: Build VPK using CMake target
        run: |
          echo "=== Building VPK target ==="
          cmake --build build --target smb2_vita.vpk --verbose 2>&1 | head -100 || true
          ls -la build/smb2_vita.vpk 2>/dev/null || echo "NOT FOUND: build/smb2_vita.vpk"

      - name: Debug build directory
        run: |
          echo "=== Full build directory listing ==="
          ls -laR build/ 2>/dev/null | head -100
          echo "=== Finding all VPK files ==="
          find . -name "*.vpk" 2>/dev/null || echo "No VPK files found"
          echo "=== Finding all SELF files ==="
          find . -name "*.self" 2>/dev/null || echo "No SELF files found"
          echo "=== Finding all ELF files ==="
          find . -name "*.elf" 2>/dev/null || echo "No ELF files found"

      - name: Find and upload VPK
        run: |
          VPK_FILE=$(find . -name "*.vpk" 2>/dev/null | head -1)
          if [ -n "$VPK_FILE" ]; then
            echo "Found VPK: $VPK_FILE"
            echo "VPK_PATH=$VPK_FILE" >> $GITHUB_ENV
          else
            echo "No VPK file found!"
            exit 1
          fi

      - name: Upload VPK artifact
        if: env.VPK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: smb2-vita-vpk
          path: ${{ env.VPK_PATH }}
          if-no-files-found: error