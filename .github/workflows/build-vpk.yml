name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    env:
      SMB2_COMMIT: b73415e1953d7fdffd4957d5fb43fa7a13844c1c
      SMB2_PRG0: 47ba60fad332fdea5ae44b7979fe1ee78de1d316ee027fea2ad5fe3c0d86f25a

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Force fresh build
        run: 'echo "Build trigger: $(date +%s)"'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --parallel "$(nproc)" 2>&1 | head -200

      - name: Create VPK manually
        run: |
          set -e
          # Find the executable
          echo "=== Checking build directory ==="
          ls -la build/
          
          # Create .elf from executable
          vita-elf-create build/smb2_vita build/smb2_vita.elf
          echo "=== ELF created ==="
          
          # Create .self
          vita-make-fself -c build/smb2_vita.elf build/smb2_vita.self
          echo "=== SELF created ==="
          ls -la build/smb2_vita.self
          
          # Create param.sfo
          vita-mksfoex -s APP_VER=01.00 "SMB2 Vita" build/param.sfo
          echo "=== param.sfo created ==="
          
          # Create VPK
          vita-pack-vpk -s build/param.sfo -b build/smb2_vita.self \
            -a assets/sce_sys/icon0.png=sce_sys/icon0.png \
            -a assets/sce_sys/livearea/contents/bg.png=sce_sys/livearea/contents/bg.png \
            -a assets/sce_sys/livearea/contents/startup.png=sce_sys/livearea/contents/startup.png \
            -a assets/sce_sys/livearea/contents/template.xml=sce_sys/livearea/contents/template.xml \
            build/smb2_vita.vpk
          
          echo "=== VPK created ==="
          ls -la build/smb2_vita.vpk
          
          # Verify VPK exists and is non-empty
          if [ ! -f build/smb2_vita.vpk ]; then
            echo "ERROR: VPK was not created!"
            exit 1
          fi
          VPK_SIZE=$(stat -c %s build/smb2_vita.vpk)
          echo "VPK size: $VPK_SIZE bytes"
          if [ "$VPK_SIZE" -lt 1000 ]; then
            echo "WARNING: VPK seems too small!"
          fi

      - name: Debug build directory
        run: |
          ls -la build/

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb2_vita.vpk
          path: build/smb2_vita.vpk
          if-no-files-found: error