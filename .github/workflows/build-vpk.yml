name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    env:
      SMB2_COMMIT: b73415e1953d7fdffd4957d5fb43fa7a13844c1c
      SMB2_PRG0: 47ba60fad332fdea5ae44b7979fe1ee78de1d316ee027fea2ad5fe3c0d86f25a

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Force fresh build
        run: 'echo "Build trigger: $(date +%s)"'

      # Pre-built rom_data.cpp (from verified PRG0 ROM) is checked in.
      # Skipping source ROM build; see README for how to rebuild from source.

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)" --verbose 2>&1 | head -200

      - name: Debug build directory
        run: |
          ls -la build/
          find build/ -name "*.vpk" -o -name "*.self" 2>/dev/null || true
          find . -name "*.vpk" -o -name "*.self" 2>/dev/null | head -20 || true

      - name: Upload VPK
        run: |
          VPK_FILE=$(find . -name "*.vpk" 2>/dev/null | head -1)
          if [ -n "$VPK_FILE" ]; then
            echo "Found VPK: $VPK_FILE"
            echo "VPK_PATH=$VPK_FILE" >> $GITHUB_ENV
          else
            echo "No VPK file found!"
            exit 1
          fi

      - name: Upload VPK artifact
        if: env.VPK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: smb2-vita-vpk
          path: ${{ env.VPK_PATH }}
          if-no-files-found: error
