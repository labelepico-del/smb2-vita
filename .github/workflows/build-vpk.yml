name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    env:
      SMB2_COMMIT: b73415e1953d7fdffd4957d5fb43fa7a13844c1c
      SMB2_PRG0: 47ba60fad332fdea5ae44b7979fe1ee78de1d316ee027fea2ad5fe3c0d86f25a

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build SMB2 ROM from disassembly
        run: |
          set -euo pipefail
          git clone https://github.com/Xkeeper0/smb2.git /tmp/smb2
          git -C /tmp/smb2 checkout --detach "$SMB2_COMMIT"
          cd /tmp/smb2
          chmod +x tools/asm6f
          mkdir -p bin
          ./tools/asm6f smb2.asm -n -c -L bin/smb2.nes
          echo "$SMB2_PRG0  bin/smb2.nes" | sha256sum --check --strict -
          mkdir -p "$GITHUB_WORKSPACE/rom"
          cp bin/smb2.nes "$GITHUB_WORKSPACE/rom/smb2.nes"

      - name: Embed ROM
        run: python3 tools/embed_rom.py rom/smb2.nes src/rom_data.cpp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: smb2-vita-vpk
          path: build/smb2_vita.vpk
          if-no-files-found: error
